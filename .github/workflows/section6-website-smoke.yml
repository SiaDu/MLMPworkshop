name: Section 6 Website Smoke Test

on:
  push:
    paths:
      - "docs/workshop03/index.html"
      - "docs/workshop03/section06.css"
      - "docs/workshop03/section06.js"
      - "docs/workshop03/app.js"
      - ".github/workflows/section6-website-smoke.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check docs/workshop03/section06.js
          node --check docs/workshop03/app.js
      - name: Validate HTML IDs and wired controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter

          base = Path("docs/workshop03")
          html = (base / "index.html").read_text(encoding="utf-8")
          js = (base / "section06.js").read_text(encoding="utf-8")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
                  self.attrs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag in ("script", "link"):
                      self.links.append(attrs.get("src") or attrs.get("href"))
                  self.attrs.append(attrs)

          probe = Probe()
          probe.feed(html)
          counts = Counter(probe.ids)
          assert not [id for id, n in counts.items() if n > 1], "Duplicate HTML IDs"
          required = (
              "s6", "s7", "s8", "s6-inspector", "s6-parser",
              "s6-response-code", "s6-response-type", "s6-question",
              "s6-feedback", "s6-python-code", "s6-output-url",
              "s6-output-info", "s6-extract-run", "s6-extract-reset"
          )
          assert all(counts[id] == 1 for id in required), "Missing Section 6 ID"
          assert "./section06.css" in probe.links
          assert "./section06.js" in probe.links
          assert sum("data-s6-case" in a for a in probe.attrs) == 3
          assert sum("data-s6-answer" in a for a in probe.attrs) == 3
          assert sum("data-s6-html" in a for a in probe.attrs) == 2
          assert sum("data-s6-pattern" in a for a in probe.attrs) == 2
          assert "05_rag.py" not in html.split('id="s6"')[1].split('id="s7"')[0]
          assert "fetch(" not in js and "XMLHttpRequest" not in js
          print("Section 6 HTML/JS structure: PASS")
          PY
