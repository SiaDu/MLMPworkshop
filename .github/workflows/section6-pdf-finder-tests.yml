name: Section 6 PDF Finder Tests

on:
  push:
    paths:
      - "workshop03_Building_an_AI_Agent/literature_research_agent_starter/06_pdf_finder.py"
      - "workshop03_Building_an_AI_Agent/literature_research_agent_starter/pyproject.toml"
      - "tests/test_section6_pdf_finder.py"
      - ".github/workflows/section6-pdf-finder-tests.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4 "pymupdf>=1.24.0"
      - name: Run unit tests (mocked HTTP; no live publisher downloads)
        run: python -m unittest discover -s tests -p "test_section6_pdf_finder.py" -v
